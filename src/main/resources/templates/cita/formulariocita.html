<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title th:text="${cita.idCita == 0} ? 'Nueva Cita' : 'Editar Cita'">Nueva Cita</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-6 offset-md-3 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">

						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()" class="btn btn-dark btn-icon mr-2" title="Regresar"><i class="mdi mdi-arrow-left"></i></a>
							<h4 class="card-title mb-0" th:text="${cita.idCita == 0} ? 'Nueva Cita' : 'Editar Cita'">Nueva Cita</h4>
						</div>
						<p class="card-description"
							th:text="${cita.idCita == 0} ? 'Registro de una nueva cita' : 'Actualizar cita'">Registro de una nueva cita</p>

						<form
							th:action="${cita.idCita == 0} ? @{/cita/guardar} : @{/cita/actualizar/{id}(id=${cita.idCita})}"
							th:object="${cita}" method="post" class="forms-sample" onsubmit="return validarCita()">

							<div class="form-group">
								<label for="idCliente">Cliente</label>
					<select class="form-control js-example-basic-single" th:field="*{idCliente}"
					id="idCliente" style="width:100%" required>
									<option value="0">Seleccione un cliente</option>
									<option th:each="cliente : ${listaClientes}"
										th:value="${cliente.idCliente}"
										th:text="${cliente.cedula + ' - ' + cliente.nombres + ' ' + cliente.apellidos}"></option>
								</select>
							</div>

							<div class="form-group">
								<label for="fecha">Fecha</label>
								<input type="date" th:field="*{fecha}"
									class="form-control" id="fecha" th:min="${cita.idCita == 0} ? ${T(java.time.LocalDate).now()} : ${null}" max="2030-12-31" onkeydown="return false;" onkeypress="return false;" onkeyup="return false;" onpaste="return false;" required>
							</div>

							<div class="form-group">
								<label for="hora">Hora</label>
								<input type="time" th:field="*{hora}"
									class="form-control" id="hora" min="08:00" max="18:00" required>
							</div>

							<div class="form-group">
								<label for="tipoCita">Tipo de Cita</label>
								<select th:field="*{tipoCita}" class="form-control js-example-basic-single"
									id="tipoCita" style="width:100%" required>
									<option value="">Seleccione...</option>
									<option th:if="${cita.tipoCita != null and !cita.tipoCita.isEmpty()}"
										th:value="${cita.tipoCita}" th:text="${cita.tipoCita}"></option>
									<option value="Consulta inicial">Consulta inicial</option>
									<option value="Control">Control</option>
									<option value="Revisión">Revisión</option>
									<option value="Examen visual">Examen visual</option>
									<option value="Entrega de lentes">Entrega de lentes</option>
									<option value="Seguimiento">Seguimiento</option>
									<option value="Urgencia">Urgencia</option>
									<option value="Otro">Otro</option>
								</select>
							</div>

							<div class="form-group">
								<label for="estado">Estado</label>
								<select class="form-control" th:field="*{estado}" id="estado">
									<option value="Pendiente">Pendiente</option>
									<option value="Confirmada">Confirmada</option>
									<option value="Completada">Completada</option>
									<option value="Cancelada">Cancelada</option>
								</select>
							</div>

							<input type="hidden" th:field="*{idCita}">

							<button type="submit" class="btn btn-primary mr-2"
								th:text="${cita.idCita == 0} ? 'Crear' : 'Actualizar'">Crear</button>
							<a th:href="@{/cita}" class="btn btn-dark">Cancelar</a>

						</form>

					</div>
				</div>
			</div>
		</div>

		<script>
			function validarCita() {
				var idCliente = document.getElementById('idCliente').value;
				if (!idCliente || idCliente === '0') {
					Swal.fire({ icon: 'warning', title: 'Atención', text: 'Debe seleccionar un cliente.' });
					return false;
				}

				var fecha = document.getElementById('fecha').value;
				var hora = document.getElementById('hora').value;
				if (!fecha || !hora) {
					Swal.fire({ icon: 'warning', title: 'Atención', text: 'Debe completar la fecha y la hora de la cita.' });
					return false;
				}

				var idCita = document.getElementById('idCita').value;
				var esNueva = !idCita || idCita === '0';
				var hoy = new Date();
				hoy.setHours(0, 0, 0, 0);
				var fechaCita = new Date(fecha + 'T00:00:00');
				if (esNueva && fechaCita < hoy) {
					Swal.fire({ icon: 'warning', title: 'Atención', text: 'No se puede agendar una cita en una fecha anterior a hoy.' });
					return false;
				}

				if (hora < '08:00' || hora > '18:00') {
					Swal.fire({ icon: 'warning', title: 'Atención', text: 'La hora de la cita debe estar entre las 08:00 y las 18:00.' });
					return false;
				}

				return true;
			}
		</script>

	</div>

</body>

</html>
