<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title th:text="${cita.idCita == 0} ? 'Nueva Cita' : 'Editar Cita'">Nueva Cita</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-6 offset-md-3 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">

						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()" class="btn btn-dark btn-icon mr-2" title="Regresar"><i class="mdi mdi-arrow-left"></i></a>
							<h4 class="card-title mb-0" th:text="${cita.idCita == 0} ? 'Nueva Cita' : 'Editar Cita'">Nueva Cita</h4>
						</div>
						<p class="card-description"
							th:text="${cita.idCita == 0} ? 'Registro de una nueva cita' : 'Actualizar cita'">Registro de una nueva cita</p>

						<form
							th:action="${cita.idCita == 0} ? @{/cita/guardar} : @{/cita/actualizar/{id}(id=${cita.idCita})}"
							th:object="${cita}" method="post" class="forms-sample">

							<div class="form-group">
								<label for="idCliente">Cliente</label>
					<select class="form-control" th:field="*{idCliente}" id="idCliente" oninput="this.setCustomValidity(this.value=='0'?'Seleccione una opción válida.':'')" onchange="this.setCustomValidity(this.value=='0'?'Seleccione una opción válida.':'')" required>
									<option value="0">Seleccione un cliente</option>
									<option th:each="cliente : ${listaClientes}"
										th:value="${cliente.idCliente}"
										th:text="${cliente.cedula + ' - ' + cliente.nombres + ' ' + cliente.apellidos}"></option>
								</select>
							</div>

							<div class="form-group">
								<label for="fecha">Fecha</label>
								<input type="date" th:field="*{fecha}"
									class="form-control" id="fecha" min="2000-01-01" max="2030-12-31" onkeydown="return false;" onkeypress="return false;" onkeyup="return false;" onpaste="return false;" required>
							</div>

							<div class="form-group">
								<label for="hora">Hora</label>
								<input type="time" th:field="*{hora}"
									class="form-control" id="hora" required>
							</div>

							<div class="form-group">
								<label for="tipoCita">Tipo de Cita</label>
								<input type="text" th:field="*{tipoCita}" class="form-control"
									id="tipoCita" placeholder="Ingrese el tipo de cita" maxlength="30" required>
							</div>

							<div class="form-group">
								<label for="estado">Estado</label>
								<select class="form-control" th:field="*{estado}" id="estado">
									<option value="Pendiente">Pendiente</option>
									<option value="Confirmada">Confirmada</option>
									<option value="Completada">Completada</option>
									<option value="Cancelada">Cancelada</option>
								</select>
							</div>

							<input type="hidden" th:field="*{idCita}">

							<button type="submit" class="btn btn-primary mr-2"
								th:text="${cita.idCita == 0} ? 'Crear' : 'Actualizar'">Crear</button>
							<a th:href="@{/cita}" class="btn btn-dark">Cancelar</a>

						</form>

					</div>
				</div>
			</div>
		</div>

	</div>

</body>

</html>
