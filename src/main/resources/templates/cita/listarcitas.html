<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Citas</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0">Citas</h4>
			<a th:href="@{/cita/nuevo}" class="btn btn-primary">+ Nueva Cita</a>
		</div>

		<form th:action="@{/cita}" method="get" class="form-inline mb-3">
			<label for="fecha" class="mr-2">Agenda del día</label>
			<input type="date" name="fecha" id="fecha" class="form-control mr-2" th:value="${fechaFiltro}">
			<button type="submit" class="btn btn-outline-primary mr-2">Filtrar</button>
			<a th:href="@{/cita}" class="btn btn-outline-dark">Ver todas</a>
		</form>

		<div class="table-responsive">
			<table class="table table-hover">
				<thead>
					<tr>

						<th>Paciente</th>
						<th>Cédula</th>
						<th>Fecha</th>
						<th>Hora</th>
						<th>Tipo Cita</th>
						<th>Estado</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="cita : ${listaCitas}">
						<td class="buscable" th:text="${cita.fkCliente.nombres + ' ' + cita.fkCliente.apellidos}"></td>
						<td class="buscable" th:text="${cita.fkCliente.cedula}"></td>
						<td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
						<td th:text="${cita.hora}"></td>
						<td th:text="${cita.tipoCita}"></td>
						<td><span class="badge-soft badge-soft-info" th:text="${cita.estado}"></span></td>
						<td class="actions-cell">
							<div class="action-icons">
								<a th:href="@{/cita/editar/{id}(id=${cita.idCita})}"
									class="btn btn-primary btn-icon" title="Editar"><i class="mdi mdi-pencil"></i></a>
								<form th:if="${!#strings.equalsIgnoreCase(cita.estado, 'Cancelada')}"
									th:action="@{/cita/cancelar/{id}(id=${cita.idCita})}" method="post"
									class="form-confirmar" data-mensaje="Cancelar esta cita" data-confirmar="Si, cancelar">
									<button type="submit" class="btn btn-warning btn-icon" title="Cancelar"><i class="mdi mdi-calendar-remove"></i></button>
								</form>
								<form th:action="@{/cita/eliminar/{id}(id=${cita.idCita})}" method="post"
									class="form-confirmar" data-mensaje="Eliminar esta cita" data-confirmar="Si, eliminar">
									<button type="submit" class="btn btn-danger btn-icon" title="Eliminar"><i class="mdi mdi-delete"></i></button>
								</form>
							</div>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaCitas)}">
						<td colspan="7" class="text-center">No hay citas registradas.</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

</body>

</html>
