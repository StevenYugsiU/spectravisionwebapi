<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title th:text="${cliente.idCliente == 0} ? 'Nuevo Cliente' : 'Editar Cliente'">Nuevo Cliente</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-10 offset-md-1 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">

						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()" class="btn btn-dark btn-icon mr-2" title="Regresar"><i class="mdi mdi-arrow-left"></i></a>
							<h4 class="card-title mb-0"
								th:text="${cliente.idCliente == 0} ? 'Nuevo Cliente' : 'Editar Cliente'">Nuevo Cliente</h4>
						</div>
						<p class="card-description"
							th:text="${cliente.idCliente == 0} ? 'Registro de un nuevo cliente' : 'Actualizar datos del cliente'">Registro de un nuevo cliente</p>

						<form
							th:action="${cliente.idCliente == 0} ? @{/cliente/guardar} : @{/cliente/actualizar/{id}(id=${cliente.idCliente})}"
							th:object="${cliente}" method="post" class="forms-sample">



							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="cedula" class="col-sm-3 col-form-label">Cédula</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{cedula}" class="form-control"
												id="cedula" placeholder="Ingrese la cédula">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="nombres" class="col-sm-3 col-form-label">Nombres</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{nombres}" class="form-control"
												id="nombres" placeholder="Ingrese los nombres">
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="apellidos" class="col-sm-3 col-form-label">Apellidos</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{apellidos}" class="form-control"
												id="apellidos" placeholder="Ingrese los apellidos">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="fechaNacimiento" class="col-sm-3 col-form-label">Fecha de Nacimiento</label>
										<div class="col-sm-9">
											<input type="date" th:field="*{fechaNacimiento}"
												class="form-control" id="fechaNacimiento">
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="edad" class="col-sm-3 col-form-label">Edad</label>
										<div class="col-sm-9">
											<input type="number" th:field="*{edad}" class="form-control"
												id="edad" placeholder="Ingrese la edad">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="ocupacion" class="col-sm-3 col-form-label">Ocupación</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{ocupacion}" class="form-control"
												id="ocupacion" placeholder="Ingrese la ocupación">
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="celular" class="col-sm-3 col-form-label">Celular</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{celular}" class="form-control"
												id="celular" placeholder="Ingrese el celular">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="correo" class="col-sm-3 col-form-label">Correo</label>
										<div class="col-sm-9">
											<input type="email" th:field="*{correo}" class="form-control"
												id="correo" placeholder="Ingrese el correo">
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="fechaRegistro" class="col-sm-3 col-form-label">Fecha de Registro</label>
										<div class="col-sm-9">
											<input type="date" th:field="*{fechaRegistro}"
												class="form-control" id="fechaRegistro">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-check form-check-flat form-check-primary mt-2">
										<label class="form-check-label"> <input type="checkbox"
											th:field="*{estado}" class="form-check-input"> Activo
										</label>
									</div>
								</div>
							</div>

							<input type="hidden" th:field="*{idCliente}">

							<button type="submit" class="btn btn-primary mr-2"
								th:text="${cliente.idCliente == 0} ? 'Crear' : 'Actualizar'">Crear</button>
							<a th:href="@{/cliente}" class="btn btn-dark">Cancelar</a>

						</form>

					</div>
				</div>
			</div>
		</div>

	</div>

</body>

</html>
