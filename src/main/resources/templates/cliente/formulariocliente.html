<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title th:text="${cliente.idCliente == 0} ? 'Nuevo Cliente' : 'Editar Cliente'">Nuevo Cliente</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-10 offset-md-1 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">

						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()" class="btn btn-dark btn-icon mr-2" title="Regresar"><i class="mdi mdi-arrow-left"></i></a>
							<h4 class="card-title mb-0"
								th:text="${cliente.idCliente == 0} ? 'Nuevo Cliente' : 'Editar Cliente'">Nuevo Cliente</h4>
						</div>
						<p class="card-description"
							th:text="${cliente.idCliente == 0} ? 'Registro de un nuevo cliente' : 'Actualizar datos del cliente'">Registro de un nuevo cliente</p>

						<form
							th:action="${cliente.idCliente == 0} ? @{/cliente/guardar} : @{/cliente/actualizar/{id}(id=${cliente.idCliente})}"
							th:object="${cliente}" method="post" class="forms-sample">



							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="cedula" class="col-sm-3 col-form-label">Cédula</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{cedula}" class="form-control"
												id="cedula" placeholder="Ingrese la cédula" maxlength="10" inputmode="numeric" pattern="[0-9]{10}" title="La cédula debe tener 10 dígitos numéricos" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="nombres" class="col-sm-3 col-form-label">Nombres</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{nombres}" class="form-control"
												id="nombres" placeholder="Ingrese los nombres" maxlength="50" oninput="this.value=this.value.replace(/[^A-Za-zÀ-ÿ\s]/g,'')" required>
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="apellidos" class="col-sm-3 col-form-label">Apellidos</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{apellidos}" class="form-control"
												id="apellidos" placeholder="Ingrese los apellidos" maxlength="50" oninput="this.value=this.value.replace(/[^A-Za-zÀ-ÿ\s]/g,'')" required>
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="fechaNacimiento" class="col-sm-3 col-form-label">Fecha de Nacimiento</label>
										<div class="col-sm-9">
											<input type="date" th:field="*{fechaNacimiento}"
												class="form-control" id="fechaNacimiento" min="1900-01-01" th:max="${T(java.time.LocalDate).now()}" onkeydown="return false;" onkeypress="return false;" onkeyup="return false;" onpaste="return false;" onchange="calcularEdadCliente()">
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="edad" class="col-sm-3 col-form-label">Edad</label>
										<div class="col-sm-9">
											<input type="number" th:field="*{edad}" class="form-control"
												id="edad" placeholder="Se calcula según la fecha de nacimiento" readonly>
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="ocupacion" class="col-sm-3 col-form-label">Ocupación</label>
										<div class="col-sm-9">
											<select th:field="*{ocupacion}" class="form-control js-example-basic-single"
											id="ocupacion" style="width:100%">
												<option value="">Seleccione...</option>
												<option th:if="${cliente.ocupacion != null and !cliente.ocupacion.isEmpty()}"
													th:value="${cliente.ocupacion}" th:text="${cliente.ocupacion}"></option>
												<option value="Estudiante">Estudiante</option>
												<option value="Docente">Docente</option>
												<option value="Ingeniero">Ingeniero</option>
												<option value="Médico">Médico</option>
												<option value="Enfermero/a">Enfermero/a</option>
												<option value="Abogado/a">Abogado/a</option>
												<option value="Contador/a">Contador/a</option>
												<option value="Comerciante">Comerciante</option>
												<option value="Empleado/a privado">Empleado/a privado</option>
												<option value="Empleado/a público">Empleado/a público</option>
												<option value="Ama de casa">Ama de casa</option>
												<option value="Chofer">Chofer</option>
												<option value="Agricultor/a">Agricultor/a</option>
												<option value="Obrero/a">Obrero/a</option>
												<option value="Jubilado/a">Jubilado/a</option>
												<option value="Desempleado/a">Desempleado/a</option>
												<option value="Policia">Policia</option>
												<option value="Militar">Militar</option>
												<option value="Otro">Otro</option>
											</select>
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="celular" class="col-sm-3 col-form-label">Celular</label>
										<div class="col-sm-9">
											<input type="text" th:field="*{celular}" class="form-control"
												id="celular" placeholder="Ingrese el celular" maxlength="10" inputmode="numeric" pattern="[0-9]{7,10}" title="Ingrese un número de teléfono válido (7 a 10 dígitos)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group row">
										<label for="correo" class="col-sm-3 col-form-label">Correo</label>
										<div class="col-sm-9">
											<input type="email" th:field="*{correo}" class="form-control"
												id="correo" placeholder="Ingrese el correo" maxlength="80">
										</div>
									</div>
								</div>
							</div>

							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label for="fechaRegistro" class="col-sm-3 col-form-label">Fecha de Registro</label>
										<div class="col-sm-9">
											<input type="date" th:field="*{fechaRegistro}"
												class="form-control" id="fechaRegistro" readonly onkeydown="return false;" onkeypress="return false;" onkeyup="return false;" onpaste="return false;">
										</div>
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-check form-check-flat form-check-primary mt-2">
										<label class="form-check-label"> <input type="checkbox"
											th:field="*{estado}" class="form-check-input"> Activo
										</label>
									</div>
								</div>
							</div>

							<input type="hidden" th:field="*{idCliente}">

							<button type="submit" class="btn btn-primary mr-2"
								th:text="${cliente.idCliente == 0} ? 'Crear' : 'Actualizar'">Crear</button>
							<a th:href="@{/cliente}" class="btn btn-dark">Cancelar</a>

						</form>

					</div>
				</div>
			</div>
		</div>

		<script>
			function calcularEdadCliente() {
				var fechaNacimiento = document.getElementById('fechaNacimiento').value;
				var edad = document.getElementById('edad');
				if (!fechaNacimiento) {
					edad.value = '';
					return;
				}
				var nacimiento = new Date(fechaNacimiento + 'T00:00:00');
				var hoy = new Date();
				var edadCalculada = hoy.getFullYear() - nacimiento.getFullYear();
				var diferenciaMeses = hoy.getMonth() - nacimiento.getMonth();
				if (diferenciaMeses < 0 || (diferenciaMeses === 0 && hoy.getDate() < nacimiento.getDate())) {
					edadCalculada--;
				}
				edad.value = edadCalculada >= 0 ? edadCalculada : '';
			}
			calcularEdadCliente();
		</script>

	</div>

</body>

</html>
