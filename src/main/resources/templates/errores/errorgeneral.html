<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>SpectraVision - Ocurrió un error</title>
<link rel="stylesheet"
	th:href="@{/assets/vendors/mdi/css/materialdesignicons.min.css}">
<link rel="stylesheet"
	th:href="@{/assets/vendors/css/vendor.bundle.base.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
<link rel="shortcut icon" th:href="@{/assets/images/favicon.png}" />
</head>

<body>
	<div class="container-scroller">
		<div class="container-fluid page-body-wrapper full-page-wrapper">
			<div
				class="content-wrapper d-flex align-items-center text-center error-page bg-warning">
				<div class="row flex-grow">
					<div class="col-lg-7 mx-auto text-white">
						<div class="row align-items-center d-flex flex-row">
							<div class="col-lg-6 text-lg-right pr-lg-4">
								<h1 class="display-1 mb-0" th:text="${status} ?: '¡Ups!'">Error</h1>
							</div>
							<div class="col-lg-6 error-page-divider text-lg-left pl-lg-4">
								<h2>¡LO SENTIMOS!</h2>
								<h3 class="font-weight-light">Ocurrió un problema al procesar
									tu solicitud. Intenta nuevamente.</h3>
							</div>
						</div>
						<div class="row mt-5">
							<div class="col-12 text-center mt-xl-2">
								<a class="text-white font-weight-medium" th:href="@{/}">Volver
									al inicio</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script th:src="@{/assets/vendors/js/vendor.bundle.base.js}"></script>
	<script th:src="@{/assets/js/off-canvas.js}"></script>
	<script th:src="@{/assets/js/hoverable-collapse.js}"></script>
	<script th:src="@{/assets/js/misc.js}"></script>
	<script th:src="@{/assets/js/settings.js}"></script>
</body>
</html>
