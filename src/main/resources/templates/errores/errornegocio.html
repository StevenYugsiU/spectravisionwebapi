<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>SpectraVision - No se pudo completar</title>
<link rel="stylesheet" th:href="@{/assets/vendors/css/vendor.bundle.base.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
<link rel="stylesheet" th:href="@{/assets/css/custom.css}">
<link rel="stylesheet" th:href="@{/assets/css/light-preview.css}">
</head>

<body>
	<div class="container-scroller">
		<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #f4f6f9;">
			<div class="card col-lg-5 mx-auto">
				<div class="card-body px-5 py-5 text-center">
					<i class="mdi mdi-alert-circle-outline text-danger" style="font-size: 3rem;"></i>
					<h4 class="mt-3">No se pudo completar la operación</h4>
					<p class="text-muted" th:text="${mensaje}">Mensaje de error</p>
					<a th:href="@{/login}" class="btn btn-primary">Volver a intentar</a>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
