<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title th:text="${rol.idRol == 0} ? 'Nuevo Rol' : 'Editar Rol'">Nuevo Rol</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-6 offset-md-3 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">


						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()" class="btn btn-dark btn-icon mr-2" title="Regresar"><i class="mdi mdi-arrow-left"></i></a>
							<h4 class="card-title mb-0">Nuevo Rol</h4>
						</div>
						<p class="card-description">Registro de un nuevo rol</p>

						<form
							th:action="${rol.idRol == 0} ? @{/rol/guardar} : @{/rol/actualizar/{id}(id=${rol.idRol})}"
							th:object="${rol}" method="post" class="forms-sample">

							<div class="form-group">
								<label for="nombre">Nombre</label>
								<input type="text" th:field="*{nombre}" class="form-control"
									id="nombre" placeholder="Ingrese el nombre del rol" required>
							</div>

							<div class="form-group">
								<label for="descripcion">Descripción</label>
								<input type="text" th:field="*{descripcion}" class="form-control"
									id="descripcion" placeholder="Ingrese la descripción" required>
							</div>

							<input type="hidden" th:field="*{idRol}">

							<button type="submit" class="btn btn-primary mr-2"
								th:text="${rol.idRol == 0} ? 'Crear' : 'Actualizar'">Crear</button>
							<a th:href="@{/rol}" class="btn btn-dark">Cancelar</a>

						</form>

					</div>
				</div>
			</div>
		</div>

	</div>

</body>

</html>
