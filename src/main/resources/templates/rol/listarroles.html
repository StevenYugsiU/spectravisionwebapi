<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Roles</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0">Roles</h4>
			<a th:href="@{/rol/nuevo}" class="btn btn-primary">+ Nuevo Rol</a>
		</div>
		<div class="table-responsive">
			<table class="table table-hover">
				<thead>
					<tr>
						<th>Nombre</th>
						<th>Descripción</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="rol : ${listaRoles}">
						<td class="buscable" th:text="${rol.nombre}"></td>
						<td th:text="${rol.descripcion}"></td>
						<td class="actions-cell">
							<div class="action-icons">
								<a th:href="@{/rol/editar/{id}(id=${rol.idRol})}"
									class="btn btn-primary btn-icon" title="Editar"><i class="mdi mdi-pencil"></i></a>
								<button th:if="${#strings.equalsIgnoreCase(rol.nombre, 'Administrador')}"
									type="button" class="btn btn-secondary btn-icon" disabled
									title="El rol Administrador no se puede eliminar"><i class="mdi mdi-delete"></i></button>
								<form th:unless="${#strings.equalsIgnoreCase(rol.nombre, 'Administrador')}"
									th:action="@{/rol/eliminar/{id}(id=${rol.idRol})}" method="post"
									onsubmit="return confirm('¿Eliminar este rol?');">
									<button type="submit" class="btn btn-danger btn-icon" title="Eliminar"><i class="mdi mdi-delete"></i></button>
								</form>
							</div>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaRoles)}">
						<td colspan="3" class="text-center">No hay roles registrados.</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

</body>

</html>
