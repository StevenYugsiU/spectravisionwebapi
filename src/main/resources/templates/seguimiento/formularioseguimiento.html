<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title th:text="${seguimiento.idSeguimiento == 0} ? 'Nuevo Seguimiento' : 'Editar Seguimiento'">Nuevo Seguimiento</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-6 offset-md-3 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">

						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()" class="btn btn-dark btn-icon mr-2" title="Regresar"><i class="mdi mdi-arrow-left"></i></a>
							<h4 class="card-title mb-0"
								th:text="${seguimiento.idSeguimiento == 0} ? 'Nuevo Seguimiento' : 'Editar Seguimiento'">Nuevo Seguimiento</h4>
						</div>
						<p class="card-description"
							th:text="${seguimiento.idSeguimiento == 0} ? 'Registro de un nuevo seguimiento' : 'Actualizar seguimiento'">Registro de un nuevo seguimiento</p>

						<form
							th:action="${seguimiento.idSeguimiento == 0} ? @{/seguimiento/guardar} : @{/seguimiento/actualizar/{id}(id=${seguimiento.idSeguimiento})}"
							th:object="${seguimiento}" method="post" class="forms-sample" onsubmit="return validarSeguimiento()">

							<div class="form-group">
								<label for="idEntrega">Entrega</label>

								<select class="form-control" th:field="*{idEntrega}" id="idEntrega" required>
									<option value="0">Seleccione una entrega</option>
									<option th:each="entrega : ${listaEntregas}"
										th:value="${entrega.idEntrega}"
										th:text="${entrega.fkCliente.nombres + ' ' + entrega.fkCliente.apellidos + ' - ' + #dates.format(entrega.fechaEntrega, 'dd/MM/yyyy')}"></option>
								</select>
							</div>

							<div class="form-group">
								<label for="fechaSeguimiento">Fecha de Seguimiento</label>
								<input type="date" th:field="*{fechaSeguimiento}"
									class="form-control" id="fechaSeguimiento" th:min="${seguimiento.idSeguimiento == 0} ? ${T(java.time.LocalDate).now()} : ${null}" max="2030-12-31" onkeydown="return false;" onkeypress="return false;" onkeyup="return false;" onpaste="return false;" required>
							</div>

							<div class="form-group">
								<label for="observaciones">Observaciones</label>
								<input type="text" th:field="*{observaciones}" class="form-control"
									id="observaciones" placeholder="Ingrese las observaciones" maxlength="200" required>
							</div>

							<div class="form-group">
								<label for="estado">Estado</label>
								<select th:field="*{estado}" class="form-control" id="estado">
									<option value="Pendiente">Pendiente</option>
									<option value="Realizado">Realizado</option>
								</select>
							</div>

							<input type="hidden" th:field="*{idSeguimiento}">

							<button type="submit" class="btn btn-primary mr-2"
								th:text="${seguimiento.idSeguimiento == 0} ? 'Crear' : 'Actualizar'">Crear</button>
							<a th:href="@{/seguimiento}" class="btn btn-dark">Cancelar</a>

						</form>

					</div>
				</div>
			</div>
		</div>

		<script>
			function validarSeguimiento() {
				var idEntrega = document.getElementById('idEntrega').value;
				if (!idEntrega || idEntrega === '0') {
					Swal.fire({ icon: 'warning', title: 'Atención', text: 'Debe seleccionar una entrega.' });
					return false;
				}
				return true;
			}
		</script>

	</div>

</body>

</html>
