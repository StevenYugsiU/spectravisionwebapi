<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Seguimientos</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0">Seguimientos</h4>
			<a th:href="@{/seguimiento/nuevo}" class="btn btn-primary">+ Nuevo Seguimiento</a>
		</div>
		<div class="table-responsive">
			<table class="table table-hover">
				<thead>
					<tr>

						<th>Paciente</th>
						<th>Cédula</th>
						<th>Fecha Seguimiento</th>
						<th>Observaciones</th>
						<th>Estado</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="seguimiento : ${listaSeguimientos}">

						<td class="buscable" th:text="${seguimiento.fkEntrega.fkCliente.nombres + ' ' + seguimiento.fkEntrega.fkCliente.apellidos}"></td>
						<td class="buscable" th:text="${seguimiento.fkEntrega.fkCliente.cedula}"></td>
						<td th:text="${#dates.format(seguimiento.fechaSeguimiento, 'dd/MM/yyyy')}"></td>
						<td th:text="${seguimiento.observaciones}"></td>
						<td><span class="badge-soft badge-soft-info" th:text="${seguimiento.estado}"></span></td>
						<td class="actions-cell">
							<div class="action-icons">
								<a th:href="@{/seguimiento/editar/{id}(id=${seguimiento.idSeguimiento})}"
									class="btn btn-primary btn-icon" title="Editar"><i class="mdi mdi-pencil"></i></a>
								<form th:action="@{/seguimiento/eliminar/{id}(id=${seguimiento.idSeguimiento})}" method="post"
									class="form-confirmar" data-mensaje="Eliminar este seguimiento" data-confirmar="Si, eliminar">
									<button type="submit" class="btn btn-danger btn-icon" title="Eliminar"><i class="mdi mdi-delete"></i></button>
								</form>
							</div>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(listaSeguimientos)}">
						<td colspan="6" class="text-center">No hay seguimientos registrados.</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

</body>

</html>
