<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/layout/layout">

<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title
	th:text="${usuariorol.idUsuarioRol == 0} ? 'Nueva Asignación de Rol' : 'Editar Asignación de Rol'">
	Nueva Asignación de Rol
</title>
</head>

<body>

	<div layout:fragment="cargarpaginas">

		<div class="row">
			<div class="col-md-6 offset-md-3 grid-margin stretch-card">
				<div class="card">
					<div class="card-body">

						<div class="d-flex align-items-center mb-2">
							<a href="javascript:history.back()"
								class="btn btn-dark btn-icon mr-2"
								title="Regresar">
								<i class="mdi mdi-arrow-left"></i>
							</a>

							<h4 class="card-title mb-0"
								th:text="${usuariorol.idUsuarioRol == 0} ? 'Nueva Asignación de Rol' : 'Editar Asignación de Rol'">
								Nueva Asignación de Rol
							</h4>
						</div>

						<p class="card-description"
							th:text="${usuariorol.idUsuarioRol == 0} ? 'Asignar un rol a un usuario' : 'Actualizar la asignación de rol'">
							Asignar un rol a un usuario
						</p>

						<form
							th:action="${usuariorol.idUsuarioRol == 0} ? @{/usuariorol/guardar} : @{/usuariorol/actualizar/{id}(id=${usuariorol.idUsuarioRol})}"
							th:object="${usuariorol}"
							method="post"
							class="forms-sample">

							<div class="form-group">
								<label for="idUsuario">Usuario</label>

								<select th:field="*{idUsuario}"
									class="form-control"
									id="idUsuario"
									required>

									<option value="">Seleccione un usuario</option>

									<option
										th:each="usuario : ${listaUsuarios}"
										th:value="${usuario.idUsuario}"
										th:text="${usuario.nombres} + ' ' + ${usuario.apellidos}">
									</option>

								</select>
							</div>

							<div class="form-group">
								<label for="idRol">Rol</label>

								<select th:field="*{idRol}"
									class="form-control"
									id="idRol"
									required>

									<option value="">Seleccione un rol</option>

									<option
										th:each="rol : ${listaRoles}"
										th:value="${rol.idRol}"
										th:text="${rol.nombre}">
									</option>

								</select>
							</div>

							<input type="hidden" th:field="*{idUsuarioRol}">

							<button type="submit"
								class="btn btn-primary mr-2"
								th:text="${usuariorol.idUsuarioRol == 0} ? 'Crear' : 'Actualizar'">
								Crear
							</button>

							<a th:href="@{/usuariorol}" class="btn btn-dark">
								Cancelar
							</a>

						</form>

					</div>
				</div>
			</div>
		</div>

	</div>

</body>
</html>
